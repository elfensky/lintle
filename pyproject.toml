[project]
name = "lintle"
version = "0.14.0"
description = "Validate and clean Two-Line Element (TLE) satellite-tracking files"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Lavrenov", email = "andrei@lav.ren" }]
keywords = [
    "tle",
    "two-line-element",
    "satellite",
    "space-track",
    "sgp4",
    "orbital-mechanics",
    "validator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Utilities",
]
dependencies = [
    "humanize>=4,<5",
    "rich>=15,<16",
    "sgp4>=2.25,<3",
]

[project.urls]
Homepage = "https://github.com/elfensky/lintle"
Repository = "https://github.com/elfensky/lintle"
Issues = "https://github.com/elfensky/lintle/issues"
Changelog = "https://github.com/elfensky/lintle/blob/main/CHANGELOG.md"

[project.scripts]
lintle = "lintle.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=9.0,<10",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3,<4",
    "ruff>=0.15,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lintle"]

# TestPyPI as a named publish target. `explicit = true` keeps it out of normal
# dependency resolution — it is only ever used via `uv publish --index testpypi`.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]
# ruff 0.16 began formatting Python code blocks inside Markdown. `docs/` holds
# dated, explicitly-unmaintained point-in-time records (see CLAUDE.md); their
# snippets document what the code looked like THEN, so reformatting them
# rewrites history rather than tidying it. ARCHITECTURE.md, README.md and
# CONTRIBUTING.md sit at the root and stay in scope.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is opt-in — long-running throughput tests excluded from the default
# suite (and from the CI matrix, which runs `uv run pytest` with no `-m`).
# Run them explicitly with `uv run pytest -m slow`.
markers = [
    "slow: opt-in long-running tests, excluded from the default suite",
]
addopts = "-m 'not slow' -n auto"
